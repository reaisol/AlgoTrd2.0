[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algotrd-v2"
version = "0.1.0"
description = "Phase 1 read-only NIFTY 50 historical data acquisition"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyarrow>=17,<22",
  "typer>=0.12,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
algotrd-data = "algotrd.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/algotrd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

